name: .NET Web API CI
 
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
 
      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x
 
      - name: Restore dependencies
        run: dotnet restore
 
      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

 # ─────────────────────────────────────────
  # JOB 2: Snyk — Dependency & Code Security
  # ─────────────────────────────────────────
  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    needs: lint
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
 
      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x
 
      - name: Restore dependencies
        run: dotnet restore
 
      # Scan NuGet dependencies for known vulnerabilities
      - name: Snyk — dependency vulnerability scan
        uses: snyk/actions/dotnet@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=WeatherForecast.cs
        continue-on-error: false   # set to false to hard-fail the pipeline on HIGH+ issues
 
      # Static code analysis for security issues (SAST)
      - name: Snyk — static code analysis (SAST)
        uses: snyk/actions/dotnet@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --severity-threshold=high
        continue-on-error: true
 
      # Upload Snyk results to GitHub Security tab (SARIF format)
      - name: Upload Snyk SARIF results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: snyk.sarif