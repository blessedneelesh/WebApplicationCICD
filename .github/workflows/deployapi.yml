name: .NET Web API CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Snyk — Dependency & Code Security
  # ─────────────────────────────────────────
  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      # Install the latest Snyk CLI
      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # Scan NuGet dependencies for known vulnerabilities
      # Replace WebApplicationCICD.sln with your actual .sln or .csproj filename
      - name: Snyk — dependency vulnerability scan
        run: snyk test --severity-threshold=high --file=WebApplicationCICD.csproj --sarif-file-output=snyk-deps.sarif
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true   # flip to false to hard-fail on HIGH+ vulnerabilities

      # Static code analysis for security issues in your own source code (SAST)
      - name: Snyk — static code analysis (SAST)
        run: snyk code test --severity-threshold=high --sarif-file-output=snyk-code.sarif
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      # Upload dependency scan results to GitHub Security tab
      - name: Upload dependency scan SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-deps.sarif
          category: snyk-dependencies

      # Upload SAST results to GitHub Security tab
      - name: Upload SAST SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

# ─────────────────────────────────────────
  # JOB 2: Build, Test & SonarQube Analysis
  # ─────────────────────────────────────────
  test:
    name: Build, Test & SonarQube Analysis
    runs-on: ubuntu-latest
    needs: snyk
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # Required by SonarQube for full blame data
 
      - name: Set up .NET
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab  # v4.3.0
        with:
          dotnet-version: 8.0.x
 
      - name: Set up Java (required by SonarQube scanner)
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v4.7.1
        with:
          distribution: temurin
          java-version: 17
 
      - name: Cache NuGet packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
 
      - name: Cache SonarQube scanner
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar
 
      - name: Install SonarQube scanner
        run: dotnet tool install --global dotnet-sonarscanner
 
      - name: Restore dependencies
        run: dotnet restore
 
      - name: Begin SonarQube analysis
        run: >
          dotnet sonarscanner begin
          /k:"${{ secrets.SONAR_PROJECT_KEY }}"
          /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.cs.opencover.reportsPaths="./coverage/**/coverage.opencover.xml"
          /d:sonar.exclusions="**/Migrations/**"
 
      - name: Build project
        run: dotnet build --no-restore --configuration Release
 
      - name: Run unit tests
        run: >
          dotnet test --no-build
          --configuration Release
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
 
      - name: End SonarQube analysis
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
 
      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: test-results
          path: ./coverage